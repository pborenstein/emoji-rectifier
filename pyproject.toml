[project]
name = "emoji-rectifier"
version = "0.1.0"
description = "Rectify gaudy emoji into tasteful text-style characters using Unicode variation selectors"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Contributors"}
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
dev = [
    "ruff>=0.6.0",
    "black>=24.0",
    "mypy>=1.9.0",
]

[project.scripts]
emoji-rectifier = "emoji_rectifier.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
